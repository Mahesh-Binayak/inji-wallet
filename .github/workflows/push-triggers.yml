name: Sonar Push Trigger

on:
  push:
    branches:
      - master
      - develop
      - qa-develop
      - 'release-**'
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master
      - develop
      - qa-develop
      - 'release-**'
  release:
    types: [published]

jobs:
  sonar-check:
    name: Sonar Analysis
    uses: Mahesh-Binayak/kattu/.github/workflows/npm-sonar-analysis.yml@dsd9685

    with:
      SERVICE_LOCATION: '.'
      NODE_VERSION: '18.x'
      SONAR_SOURCES: '.'
      SONAR_TESTS: '.'
      SONAR_TEST_INCLUSIONS: '**/*.spec.ts,**/*.test.ts'
      SONAR_EXCLUSIONS: '**/node_modules/**,**/android/**,**/ios/**,**/build/**,**/dist/**,**/*.java'

    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      ORG_KEY: ${{ secrets.ORG_KEY }}
